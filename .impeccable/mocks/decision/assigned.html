<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kassa — Box Label</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--kraft:#E9DFCB;--ink:#121212;--muted:#5E5A52;--red:#E8321E;--green:#0F8A4B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{margin:0;background:#777;font-family:"Barlow",sans-serif;-webkit-font-smoothing:antialiased}
  #frame{width:390px;height:844px;overflow:hidden;background:var(--kraft);margin:0 auto;position:relative;color:var(--ink);display:flex;flex-direction:column}
  .status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;font-family:"Share Tech Mono",monospace}
  .status .sys{display:flex;align-items:center;gap:5px}
  .title{padding:8px 16px 10px;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .body{flex:1;overflow:hidden;padding:0 16px}
  .key{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--muted)}
  .mono{font-family:"Share Tech Mono",monospace;font-variant-numeric:tabular-nums}
  .scan{height:40px;border:1px solid var(--ink);background:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;position:relative}
  .scan .ph{flex:1;font-size:13px;color:var(--muted)}
  .scan .laser{position:absolute;top:50%;left:34%;width:32%;height:2px;background:var(--red)}
  .card{border:1px solid var(--ink);background:#fff;margin-top:12px}
  .grid{display:grid;grid-template-columns:86px 1fr}
  .grid>div{border-top:1px solid var(--ink);padding:0 10px;height:38px;display:flex;align-items:center;font-size:13px;line-height:1.2}
  .grid>div:nth-child(-n+2){border-top:0}
  .grid .k{border-right:1px solid var(--ink)}
  .grid .v{font-weight:500}
  .stock{color:var(--green);font-weight:600}
  .strip{border-top:1px solid var(--ink);padding:9px 10px 6px}
  .strip svg{display:block;width:100%;height:28px}
  .imei{font-family:"Share Tech Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.04em;margin-top:5px}
  .price{border-top:1px solid var(--ink);height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
  .price .num{font-family:"Share Tech Mono",monospace;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .totals{border:1px solid var(--ink);background:#fff;margin-top:12px;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .totals .cell{border:2px solid var(--ink);padding:5px 12px;font-family:"Share Tech Mono",monospace;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .pay{margin-top:12px;height:48px;background:var(--ink);color:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
  .tabs{display:flex;border-top:1px solid var(--ink);background:var(--kraft)}
  .tab{flex:1;padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
  .tab span{font-size:11px;font-weight:500}
  .tab.active{color:var(--ink)}
  .tab.active span{font-weight:600}
</style>
</head>
<body>
<div id="frame">
  <div class="status">
    <span>12:47</span>
    <span class="sys">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" fill="#121212"/><rect x="4" y="5" width="3" height="7" fill="#121212"/><rect x="8" y="2" width="3" height="10" fill="#121212"/><rect x="12" y="0" width="3" height="12" fill="#121212"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#121212" stroke-width="1.4"><path d="M1 4.5C4.5 1.5 11.5 1.5 15 4.5"/><path d="M3.5 7C6 5 10 5 12.5 7"/><circle cx="8" cy="10" r="1" fill="#121212" stroke="none"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2" fill="none" stroke="#121212"/><rect x="2" y="2" width="15" height="8" fill="#121212"/><rect x="21.5" y="4" width="2" height="4" fill="#121212"/></svg>
    </span>
  </div>
  <div class="title">Kassa</div>
  <div class="body">
    <div class="scan">
      <span class="key">IMEI</span>
      <span class="ph">IMEI skanerlang yoki kiriting (15 xona)</span>
      <svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#121212" stroke-width="1.4"><rect x="1" y="3" width="18" height="12" rx="1.5"/><path d="M6 3l1.5-2h5L14 3"/><circle cx="10" cy="9" r="3.2"/></svg>
      <div class="laser"></div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="key k">Model</div><div class="v">Samsung Galaxy S23 Ultra</div>
        <div class="key k">Xotira</div><div class="v mono">256 GB</div>
        <div class="key k">Rang</div><div class="v">Qora</div>
        <div class="key k">Holat</div><div class="v"><span class="stock">Omborda</span></div>
      </div>
      <div class="strip">
        <svg viewBox="0 0 236 28" preserveAspectRatio="none"><g fill="#121212">
          <rect x="4" y="0" width="3" height="28"/><rect x="9" y="0" width="2" height="28"/><rect x="14" y="0" width="4" height="28"/><rect x="20" y="0" width="2" height="28"/><rect x="26" y="0" width="3" height="28"/><rect x="31" y="0" width="5" height="28"/><rect x="39" y="0" width="2" height="28"/><rect x="43" y="0" width="3" height="28"/><rect x="49" y="0" width="2" height="28"/><rect x="56" y="0" width="4" height="28"/><rect x="62" y="0" width="2" height="28"/><rect x="67" y="0" width="3" height="28"/><rect x="72" y="0" width="5" height="28"/><rect x="80" y="0" width="2" height="28"/><rect x="86" y="0" width="3" height="28"/><rect x="91" y="0" width="2" height="28"/><rect x="96" y="0" width="4" height="28"/><rect x="102" y="0" width="3" height="28"/><rect x="108" y="0" width="2" height="28"/><rect x="112" y="0" width="5" height="28"/>
          <rect x="120" y="0" width="2" height="28"/><rect x="124" y="0" width="3" height="28"/><rect x="131" y="0" width="2" height="28"/><rect x="135" y="0" width="4" height="28"/><rect x="142" y="0" width="2" height="28"/><rect x="146" y="0" width="3" height="28"/><rect x="152" y="0" width="5" height="28"/><rect x="159" y="0" width="2" height="28"/><rect x="164" y="0" width="3" height="28"/><rect x="169" y="0" width="2" height="28"/><rect x="175" y="0" width="4" height="28"/><rect x="181" y="0" width="3" height="28"/><rect x="187" y="0" width="2" height="28"/><rect x="191" y="0" width="5" height="28"/><rect x="199" y="0" width="2" height="28"/><rect x="203" y="0" width="3" height="28"/><rect x="209" y="0" width="4" height="28"/><rect x="215" y="0" width="2" height="28"/><rect x="220" y="0" width="3" height="28"/><rect x="225" y="0" width="4" height="28"/>
        </g></svg>
        <div class="imei">35851102 074960 6</div>
      </div>
      <div class="price"><span class="key">Narx</span><span class="num">$1,250</span></div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="key k">Model</div><div class="v">Apple iPhone 15 Pro</div>
        <div class="key k">Xotira</div><div class="v mono">128 GB</div>
        <div class="key k">IMEI</div><div class="v imei" style="margin:0">35711100 022233 3</div>
      </div>
      <div class="price"><span class="key">Narx</span><span class="num">$1,100</span></div>
    </div>

    <div class="totals"><span class="key">Jami</span><span class="cell">$2,350</span></div>
    <div class="pay">Sotuvni yakunlash</div>
  </div>

  <div class="tabs">
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Bosh sahifa</span></div>
    <div class="tab active"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v6M18 9v6"/></svg><span>Kassa</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Savdolar</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg><span>Ombor</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Yana</span></div>
  </div>
</div>
</body>
</html>
