<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Kassa — Material 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:#FFFBFE; --on:#1C1B1F; --primary:#6750A4; --pcont:#EADDFF;
    --svar:#E7E0EC; --outline:#79747E; --onvar:#49454F; --scont:#E8DEF8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#777;font-family:"Roboto",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
  #frame{width:390px;height:844px;background:var(--surface);color:var(--on);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .status{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;font-weight:500}
  .status .icons{display:flex;gap:5px;align-items:center}
  .status svg{width:15px;height:15px;fill:var(--on)}
  .appbar{height:64px;display:flex;align-items:center;padding:0 16px}
  .appbar h1{font-size:22px;font-weight:400;line-height:28px}
  .body{flex:1;overflow:hidden;padding:4px 16px 0}
  /* outlined text field */
  .field{position:relative;height:56px;margin-top:12px}
  .field .box{position:absolute;inset:0;border:1px solid var(--outline);border-radius:4px;display:flex;align-items:center;padding:0 12px;gap:12px}
  .field .lbl{position:absolute;top:-8px;left:38px;background:var(--surface);padding:0 4px;font-size:12px;color:var(--primary)}
  .field .ph{flex:1;font-size:16px;color:var(--onvar)}
  .field svg{width:24px;height:24px;stroke:var(--onvar);fill:none;stroke-width:1.8;flex:none}
  /* cart */
  .carthead{font-size:14px;font-weight:500;color:var(--onvar);padding:20px 4px 4px}
  .item{height:72px;display:flex;align-items:center;gap:16px;padding:0 4px}
  .item .txt{flex:1;min-width:0}
  .item .head{font-size:16px;line-height:24px}
  .item .sup{font-size:14px;line-height:20px;color:var(--onvar)}
  .item .price{font-size:16px;font-weight:500}
  .divider{height:1px;background:var(--svar);margin:0 4px}
  .totals{display:flex;justify-content:space-between;align-items:center;padding:20px 4px 16px;font-size:16px;font-weight:500}
  /* buttons */
  .filled{display:flex;align-items:center;justify-content:center;width:100%;height:40px;border-radius:20px;background:var(--primary);color:#fff;font-size:14px;font-weight:500;letter-spacing:.1px}
  .outlined{display:flex;align-items:center;justify-content:center;width:100%;height:40px;border-radius:20px;border:1px solid var(--outline);color:var(--primary);font-size:14px;font-weight:500;margin-top:12px;letter-spacing:.1px}
  /* navigation bar */
  .nav{height:80px;display:flex;background:var(--surface);border-top:1px solid var(--svar)}
  .nav .dest{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:12px}
  .nav .ind{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
  .nav .dest.active .ind{background:var(--scont)}
  .nav svg{width:24px;height:24px;stroke:var(--onvar);fill:none;stroke-width:1.8}
  .nav .dest.active svg{stroke:var(--on)}
  .nav .cap{font-size:12px;font-weight:500;color:var(--onvar);line-height:16px}
  .nav .dest.active .cap{color:var(--on)}
</style>
</head>
<body>
<div id="frame">

  <div class="status">
    <span>12:47</span>
    <span class="icons">
      <svg viewBox="0 0 24 24"><path d="M3 20h3v-6H3v6zm5 0h3V9H8v11zm5 0h3V4h-3v16zm5 0h3v-9h-3v9z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 4C7 4 3 7 1 11l11 9 11-9c-2-4-6-7-11-7z" fill-opacity=".35"/><path d="M12 4C7 4 3 7 1 11l11 9z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.7 4H14V2h-4v2H8.3C7.6 4 7 4.6 7 5.3v15.4c0 .7.6 1.3 1.3 1.3h7.4c.7 0 1.3-.6 1.3-1.3V5.3C17 4.6 16.4 4 15.7 4z"/></svg>
    </span>
  </div>

  <div class="appbar"><h1>Kassa</h1></div>

  <div class="body">

    <div class="field">
      <div class="box">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7M17 21h4"/></svg>
        <span class="ph">IMEI skanerlang yoki kiriting (15 xona)</span>
        <svg viewBox="0 0 24 24"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </div>
      <span class="lbl">IMEI</span>
    </div>

    <div class="carthead">2 ta qurilma</div>

    <div class="item">
      <div class="txt">
        <div class="head">Samsung Galaxy S23 Ultra · 256 GB</div>
        <div class="sup">IMEI 358511020749606</div>
      </div>
      <span class="price">$1,250</span>
    </div>
    <div class="divider"></div>
    <div class="item">
      <div class="txt">
        <div class="head">Apple iPhone 15 Pro · 128 GB</div>
        <div class="sup">IMEI 357111000222333</div>
      </div>
      <span class="price">$1,100</span>
    </div>

    <div class="totals"><span>Jami</span><span>$2,350</span></div>

    <div class="filled">Sotuvni yakunlash</div>
    <div class="outlined">Oddiy xaridor</div>

  </div>

  <div class="nav">
    <div class="dest">
      <div class="ind"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></div>
      <span class="cap">Bosh sahifa</span>
    </div>
    <div class="dest active">
      <div class="ind"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M7 20h10M12 16v4"/></svg></div>
      <span class="cap">Kassa</span>
    </div>
    <div class="dest">
      <div class="ind"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></div>
      <span class="cap">Savdolar</span>
    </div>
    <div class="dest">
      <div class="ind"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
      <span class="cap">Ombor</span>
    </div>
    <div class="dest">
      <div class="ind"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></div>
      <span class="cap">Yana</span>
    </div>
  </div>

</div>
</body>
</html>
