<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kassa — Nasiya Daftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E3; --rule:#D9D2BF; --red:#C1272D;
    --navy:#1B2A6B; --navy-dark:#141F4D; --grey:#8A8A8A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#777;font-family:"Work Sans",sans-serif;
    display:flex;justify-content:center;align-items:flex-start}
  .tnum{font-variant-numeric:tabular-nums}
  #frame{position:relative;width:390px;height:844px;overflow:hidden;
    background:var(--cream);display:flex;flex-direction:column}

  /* status bar */
  .status{height:24px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:12px;font-weight:600;color:var(--navy);flex:0 0 auto}
  .status .sys{display:flex;align-items:center;gap:5px}
  .status svg{display:block}

  /* title */
  .title{height:44px;display:flex;align-items:center;padding-left:16px;
    font-size:22px;font-weight:600;color:var(--navy);flex:0 0 auto}

  /* ledger page */
  .ledger{position:relative;flex:1 1 auto;
    background:repeating-linear-gradient(to bottom,
      transparent 0,transparent 43px,var(--rule) 43px,var(--rule) 44px)}
  .margin-rule{position:absolute;left:72px;top:0;bottom:0;width:1px;
    background:var(--red)}

  .row{position:relative;height:44px}
  .mcol{position:absolute;left:0;width:62px;text-align:right;
    line-height:44px;font-size:13px;color:var(--navy)}
  .info{position:absolute;left:84px;right:84px;top:0;height:44px;
    display:flex;flex-direction:column;justify-content:center}
  .info .nm{font-size:14px;color:var(--navy)}
  .info .imei{font-size:12px;color:var(--grey)}
  .price{position:absolute;right:16px;line-height:44px;
    font-size:14px;color:var(--navy)}

  /* scan field = navy underlined top rule */
  .scan{position:relative;height:44px;border-bottom:2px solid var(--navy)}
  .scan .ph{position:absolute;left:16px;line-height:44px;font-size:14px;color:var(--grey)}
  .scan .cam{position:absolute;right:16px;top:11px;color:var(--navy)}

  /* total */
  .total{position:relative;height:44px;border-top:3px double var(--navy)}
  .total .lbl{position:absolute;left:84px;line-height:44px;font-size:14px;
    font-weight:500;color:var(--navy)}
  .total .amt{position:absolute;right:16px;line-height:44px;
    font-size:20px;font-weight:600;color:var(--navy)}

  /* customer */
  .cust{position:absolute;left:84px;line-height:44px;font-size:14px;color:var(--grey)}

  /* pay stamp */
  .pay{margin:8px 16px 0;height:48px;background:var(--navy);color:var(--cream);
    border:1px solid var(--navy-dark);border-radius:6px;font-family:inherit;
    font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center}

  /* tab bar */
  .tabs{height:64px;flex:0 0 auto;display:flex;border-top:1px solid var(--rule)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;color:var(--grey)}
  .tab.active{color:var(--navy)}
  .tab span{font-size:11px}
  .tab svg{display:block}
</style>
</head>
<body>
<div id="frame">

  <div class="status">
    <span class="tnum">12:47</span>
    <span class="sys">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4.5a10 10 0 0 1 14 0"/><path d="M3.5 7a6.5 6.5 0 0 1 9 0"/><circle cx="8" cy="9.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="20" height="10" rx="2.5"/><rect x="2.5" y="2.5" width="14" height="7" rx="1" fill="currentColor"/><rect x="22" y="4" width="2" height="4" rx="1" fill="currentColor" stroke="none"/></svg>
    </span>
  </div>

  <div class="title">Kassa</div>

  <div class="ledger">
    <div class="margin-rule"></div>

    <div class="scan">
      <span class="ph">IMEI skanerlang yoki kiriting (15 xona)</span>
      <span class="cam"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg></span>
    </div>

    <div class="row">
      <span class="mcol tnum">1,250</span>
      <span class="info"><span class="nm">Samsung Galaxy S23 Ultra · 256 GB</span><span class="imei tnum">IMEI 358511020749606</span></span>
      <span class="price tnum">$1,250</span>
    </div>

    <div class="row">
      <span class="mcol tnum">2,350</span>
      <span class="info"><span class="nm">Apple iPhone 15 Pro · 128 GB</span><span class="imei tnum">IMEI 357111000222333</span></span>
      <span class="price tnum">$1,100</span>
    </div>

    <div class="total">
      <span class="lbl">Jami</span>
      <span class="amt tnum">$2,350</span>
    </div>

    <div class="row">
      <span class="cust">Oddiy xaridor · 14 kun kafolat</span>
    </div>

    <button class="pay">Sotuvni yakunlash</button>
  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7"/><path d="M5 9v11h14V9"/></svg>
      <span>Bosh sahifa</span>
    </div>
    <div class="tab active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 12.5a1.5 1.5 0 0 0 1.5 1.2h8.5a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="18" cy="20.5" r="1.3"/></svg>
      <span>Kassa</span>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l3 3v17l-2.5-1.5L13 22l-2.5-1.5L8 22l-2-1.5V2z"/><path d="M8.5 7h7M8.5 11h7M8.5 15h4"/></svg>
      <span>Savdolar</span>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      <span>Ombor</span>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Yana</span>
    </div>
  </div>

</div>
</body>
</html>
