name: mobile_erp
description: "Malika Bazaar — local-first ERP/POS (Flutter port)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # Local DB / offline
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.27

  # Platform
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.0

  # Domain helpers
  decimal: ^3.0.2
  intl: ^0.20.2

  # Scanning (HID handled via a focused field; camera via this)
  mobile_scanner: ^6.0.7
  fl_chart: ^1.3.0
  printing: ^5.15.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/uz/
    - assets/l10n/en/
