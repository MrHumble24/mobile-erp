# This is a single-package repo; `packages` is declared because pnpm errors on a
# workspace file that only carries settings ("packages field missing or empty").
packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true

overrides:
  multer: ^2.5.0
